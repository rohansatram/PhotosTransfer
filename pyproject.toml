[project]
name = "photosbackup"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
addopts    = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "sync_to_pixel.py", "main.py", ".venv/*"]
